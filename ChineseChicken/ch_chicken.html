<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Chicken</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #f0f0f0;
      position: relative;
    }
    img {
      position: absolute;
      width: 150px;
      height: auto;
    }
    .word {
      position: absolute;
      font-weight: bold;
      color: #ff5722;
      animation: fadeOut 3s forwards;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <img id="chicken" src="chicken.jpg" alt="Chicken Image" />
  <script>
    // Movement parameters
    const chicken = document.getElementById("chicken");
    let x = 100; // Initial x-coordinate
    let y = 100; // Initial y-coordinate
    let dx = 4;  // Speed in the x-direction
    let dy = 3;  // Speed in the y-direction

    // Set initial position
    chicken.style.left = `${x}px`;
    chicken.style.top = `${y}px`;

    // Random Chinese words
    const chineseWords = ["你好", "鸡", "美味", "快乐", "成功", "和平", "智慧", "幸福", "健康", "胜利"];

    // Function to move the chicken
    function moveChicken() {
      // Update position
      x += dx;
      y += dy;

      // Reflect if hitting a wall
      if (x <= 0 || x + chicken.offsetWidth >= window.innerWidth) {
        dx = -dx; // Reverse x direction
      }
      if (y <= 0 || y + chicken.offsetHeight >= window.innerHeight) {
        dy = -dy; // Reverse y direction
      }

      // Update chicken's position
      chicken.style.left = `${x}px`;
      chicken.style.top = `${y}px`;

      requestAnimationFrame(moveChicken);
    }

    // Generate a random Chinese word
    function generateRandomWord(event) {
      const word = chineseWords[Math.floor(Math.random() * chineseWords.length)];
      const size = Math.floor(Math.random() * 50) + 20;

      const wordElement = document.createElement("div");
      wordElement.className = "word";
      wordElement.style.fontSize = `${size}px`;
      wordElement.style.left = `${event.clientX}px`;
      wordElement.style.top = `${event.clientY}px`;
      wordElement.textContent = word;

      document.body.appendChild(wordElement);

      setTimeout(() => {
        wordElement.remove();
      }, 3000); // Remove after 3 seconds
    }

    // Add event listener for clicks
    chicken.addEventListener("click", generateRandomWord);

    // Start moving the chicken
    moveChicken();
  </script>
</body>
</html>
